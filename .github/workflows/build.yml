name: build-apk

# 「v」で始まるタグを push すると、そのタグの Release を自動で作る（タグ名は push したものがそのまま使われる）。
# 手動で実行（Actions の「Run workflow」）するときは、ブランチかタグを選ぶ。タグを選んだときだけ Release を作り、ブランチなら artifact だけ作る。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 既定は読み取りだけ。書き込み（Release）は release ジョブにだけ与える。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # 認証情報をディスクに残さない（persist-credentials: false）。ビルドが読む依存ライブラリから GITHUB_TOKEN を取られないように。
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # QNN のヘッダーと .so は、非公開の補助リポジトリから読む（公開リポジトリには入れない）。
      # 読み取り専用の fine-grained PAT を、このリポジトリの secret DEPS_TOKEN に入れておく。
      - name: Checkout QNN deps (private)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: realryo1/dragonspeedxl-qnn-deps
          token: ${{ secrets.DEPS_TOKEN }}
          path: qnn-deps
          persist-credentials: false

      - name: Place QNN headers and runtime libraries
        run: |
          mkdir -p third_party/qnn app/src/main/jniLibs/arm64-v8a
          cp -r qnn-deps/include third_party/qnn/include
          cp qnn-deps/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          ls third_party/qnn/include/QnnInterface.h app/src/main/jniLibs/arm64-v8a/

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu の runner には Android SDK が入っている（ANDROID_HOME）。sdkmanager は版の付いた場所にあるので、そこから探す。
      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;30.0.16248370" "cmake;4.1.2"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # リリースの署名鍵は secrets から復元する（リポジトリには入れない）。鍵の場所とパスワードは環境変数で渡す（app/build.gradle.kts）。
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DSXL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          DSXL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DSXL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DSXL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Remove release keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Read version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dragonspeedxl-${{ steps.ver.outputs.name }}-release
          path: app/build/outputs/apk/release/app-release.apk

  # Release への書き込みだけをここに置く。署名鍵は使わない（build で作った APK を受け取るだけ）。
  release:
    # タグのとき（push、またはタグを選んだ手動実行）だけ Release を作る。ブランチの手動実行は artifact だけ。
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: apk
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: dragonspeedXL ${{ github.ref_name }}
          prerelease: true
          files: apk/app-release.apk
          body: |
            Discord 鯖向けのリリース版（リリース鍵で署名した APK）。
            初回に、モデルを Hugging Face（realryo1/dragonspeedxl-models、CC BY-NC-SA 4.0）から取得します（約 7.6GB）。
