name: build-apk

# 手動で実行（Actions の「Run workflow」）すると、APK を作り、Release を次の番号で作る。
# 番号は既存の v<番号> タグの最大に 1 を足したもの（v1、v2 があれば v3）。入力はない。
# 番号は plan ジョブで一度だけ決め、ビルド（版の名前と versionCode）と Release の両方がそれを使う。
on:
  workflow_dispatch:

# 既定は読み取りだけ。書き込み（Release）は release ジョブにだけ与える。
permissions:
  contents: read

jobs:
  # 次の番号を決める。タグは release ジョブで作る（ビルドが失敗したら、番号は使われない）。
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      number: ${{ steps.tag.outputs.number }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # 既存の v<番号> タグの最大に 1 を足す（v1、v2 があれば v3）。v の付かないタグ（2 など）は数えない。
      - name: Decide next tag
        id: tag
        run: |
          max=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v*' \
            | grep -oE 'refs/tags/v[0-9]+$' | sed 's#refs/tags/v##' | sort -n | tail -1)
          n=$(( ${max:-0} + 1 ))
          echo "number=$n" >> "$GITHUB_OUTPUT"
          echo "tag=v$n" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # 認証情報をディスクに残さない（persist-credentials: false）。ビルドが読む依存ライブラリから GITHUB_TOKEN を取られないように。
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # QNN のヘッダーと .so は、非公開の補助リポジトリから読む（公開リポジトリには入れない）。
      # 読み取り専用の fine-grained PAT を、このリポジトリの secret DEPS_TOKEN に入れておく。
      - name: Checkout QNN deps (private)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: realryo1/dragonspeedxl-qnn-deps
          token: ${{ secrets.DEPS_TOKEN }}
          path: qnn-deps
          persist-credentials: false

      - name: Place QNN headers and runtime libraries
        run: |
          mkdir -p third_party/qnn app/src/main/jniLibs/arm64-v8a
          cp -r qnn-deps/include third_party/qnn/include
          cp qnn-deps/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          ls third_party/qnn/include/QnnInterface.h app/src/main/jniLibs/arm64-v8a/

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu の runner には Android SDK が入っている（ANDROID_HOME）。sdkmanager は版の付いた場所にあるので、そこから探す。
      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;30.0.16248370" "cmake;4.1.2"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # リリースの署名鍵は secrets から復元する（リポジトリには入れない）。鍵の場所とパスワードは環境変数で渡す（app/build.gradle.kts）。
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DSXL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          DSXL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DSXL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DSXL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PdsxlRelease=${{ needs.plan.outputs.number }}

      - name: Remove release keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release.jks"

      # APK の名前を dragonspeedXL_v<番号>.apk にする（Release に上がる名前と同じ）。
      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/dragonspeedXL_${{ needs.plan.outputs.tag }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dragonspeedxl-${{ needs.plan.outputs.tag }}-release
          path: dist/dragonspeedXL_${{ needs.plan.outputs.tag }}.apk

  # Release への書き込みだけをここに置く。署名鍵は使わない（build で作った APK を受け取るだけ）。
  release:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: apk
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: dragonspeedXL ${{ needs.plan.outputs.tag }}
          prerelease: true
          files: apk/dragonspeedXL_${{ needs.plan.outputs.tag }}.apk
