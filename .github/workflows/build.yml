name: build-apk

# 手動で実行する（Actions の「Run workflow」）。
# tag を入れると、APK を GitHub Release に上げる。空なら、Actions の artifact だけ。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release のタグ（例: v0.1.0）。空なら artifact だけ作る"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      # QNN のヘッダーと .so は、非公開の補助リポジトリから読む（公開リポジトリには入れない）。
      # 読み取り専用の fine-grained PAT を、このリポジトリの secret DEPS_TOKEN に入れておく。
      - name: Checkout QNN deps (private)
        uses: actions/checkout@v4
        with:
          repository: realryo1/dragonspeedxl-qnn-deps
          token: ${{ secrets.DEPS_TOKEN }}
          path: qnn-deps

      - name: Place QNN headers and runtime libraries
        run: |
          mkdir -p third_party/qnn app/src/main/jniLibs/arm64-v8a
          cp -r qnn-deps/include third_party/qnn/include
          cp qnn-deps/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          ls third_party/qnn/include/QnnInterface.h app/src/main/jniLibs/arm64-v8a/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu の runner には Android SDK（sdkmanager）が入っている。足りないパッケージだけ入れる。
      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;30.0.16248370" "cmake;4.1.2"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # リリースの署名鍵は secrets から復元する（リポジトリには入れない）。鍵の場所とパスワードは環境変数で渡す（app/build.gradle.kts）。
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DSXL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          DSXL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DSXL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DSXL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Read version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragonspeedxl-${{ steps.ver.outputs.name }}-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: dragonspeedXL ${{ inputs.tag }}
          prerelease: true
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            Discord 鯖向けのリリース版（リリース鍵で署名した APK）。
            初回に、モデルを Hugging Face（realryo1/dragonspeedxl-models、CC BY-NC-SA 4.0）から取得します（約 7.6GB）。
